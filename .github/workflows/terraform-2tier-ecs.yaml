# aws auth
# terraform version 1.16.0
# terrafrom path - infra

name: terraform-2tier-ecs

on:
    workflow_dispatch:
env:
    TF_VERSION: 1.16.2
    TF_PATH: terraform-2tier-ecs/infra
jobs:
    terraform-plan:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v4
              with:
                terraform_version: ${{env.TF_VERSION}}
            
            - name: initiailise terraform
              run: |
                cd ${{ env.TF_PATH}}
                terraform init

            - name: Plan terraform
              working-directory: ${{ env.TF_PATH}}
              run: terraform plan


